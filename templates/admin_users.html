{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">👥 Manage Users</h1>
</div>

<div style="margin-bottom:16px;">
    <a href="{{ url_for('admin_add_user') }}" class="btn">➕ Add User</a>
</div>

<div class="table-container">
    <table class="styled-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>
                    <span class="role-badge role-{{ user.role }}">{{ user.role }}</span>
                </td>
                <td>
                    {% if user.id != current_user.id %}
                    <a class="btn" href="{{ url_for('admin_delete_user', user_id=user.id) }}" 
                       onclick="return confirm('Delete user {{ user.username }}?')"
                       style="background:var(--red);">🗑 Delete</a>
                    {% else %}
                    <span style="color:var(--muted);">You</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
