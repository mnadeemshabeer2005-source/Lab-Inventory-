{% extends "base.html" %}
{% block content %}
<div class="confirm-container">
    <div class="confirm-card">
        <div class="confirm-icon">🔧</div>
        <h2>Add Resource</h2>
        <form method="POST" style="display:flex; flex-direction:column; gap:12px; margin-top:16px; text-align:left;">
            <label style="font-weight:600;">Link to Equipment (optional)
                <select name="equipment_id" id="equipment_id" onchange="fillFromEquipment(this)">
                    <option value="">— Not linked (e.g. Lab room) —</option>
                    {% for e in equipments %}
                    <option value="{{ e.id }}" data-name="{{ e.name }}" data-loc="{{ e.location or '' }}">{{ e.name }}{% if e.model %} ({{ e.model }}){% endif %}</option>
                    {% endfor %}
                </select>
            </label>
            <label style="font-weight:600;">Resource Name *
                <input type="text" name="name" required placeholder="e.g. Lab, Incubator, Centrifuge">
            </label>
            <label style="font-weight:600;">Description
                <input type="text" name="description" placeholder="Optional details">
            </label>
            <label style="font-weight:600;">Calendar Color
                <input type="color" name="color" value="#007bff" style="width:60px; height:40px; padding:2px; cursor:pointer;">
            </label>
            <div style="display:flex; gap:10px; margin-top:8px;">
                <button type="submit" class="btn" style="background:var(--green); flex:1;">Add Resource</button>
                <a href="{{ url_for('manage_resources') }}" class="btn btn-secondary" style="flex:1; text-align:center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script>
function fillFromEquipment(sel) {
    const o = sel.options[sel.selectedIndex];
    if (!o.value) return;
    const n = document.querySelector('input[name="name"]');
    const d = document.querySelector('input[name="description"]');
    if (!n.value) n.value = o.dataset.name;
    if (!d.value) d.value = o.dataset.loc;
}
</script>
{% endblock %}
