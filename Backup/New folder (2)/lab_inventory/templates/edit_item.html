{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 style="margin-bottom: 20px; color:#007bff;">Edit Item</h2>
    <form method="POST" class="form-grid">
        
        <label>Name<br>
            <input type="text" name="name" value="{{ item.name }}" required>
        </label>

        <label>Quantity<br>
            <input type="number" name="quantity" value="{{ item.quantity }}" required min="0">
        </label>

        <label>Cupboard<br>
            <input type="text" name="cupboard" value="{{ item.cupboard }}" required>
        </label>

        <label>Shelf<br>
            <input type="text" name="shelf" value="{{ item.shelf }}">
        </label>

        <label>Box<br>
            <input type="text" name="box" value="{{ item.box }}">
        </label>

        <label>Expiry Date<br>
            <input type="date" name="expiry_date" value="{{ item.expiry_date }}">
        </label>

        <label style="grid-column: 1 / -1;">Notes<br>
            <textarea name="notes" rows="3">{{ item.notes }}</textarea>
        </label>

        <div style="grid-column: 1 / -1; margin-top: 15px;">
            <button class="btn" type="submit">Update</button>
            <a class="btn" href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
