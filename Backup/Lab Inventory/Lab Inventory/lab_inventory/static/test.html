{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Items</h2>
    <form method="GET" action="{{ url_for('index') }}" class="d-flex">
        <input type="text" name="search" class="form-control me-2" placeholder="Search items..." value="{{ request.args.get('search', '') }}">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover table-bordered align-middle">
        <thead class="table-primary">
            <tr>
                <th>Name</th>
                <th>Cupboard</th>
                <th>Shelf</th>
                <th>Box</th>
                <th>Quantity</th>
                <th style="width: 150px;">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.cupboard }}</td>
                <td>{{ item.shelf }}</td>
                <td>{{ item.box }}</td>
                <td>{{ item.quantity }}</td>
                <td>
                    <a href="{{ url_for('edit_item', id=item.id) }}" class="btn btn-sm btn-success me-1">
                        ✏ Edit
                    </a>
                    <a href="{{ url_for('delete_item', id=item.id) }}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this item?');">
                        🗑 Delete
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6" class="text-center text-muted">No items found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
