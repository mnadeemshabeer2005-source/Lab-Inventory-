{% extends "base.html" %}
{% block content %}
<div class="card">
    <form class="search" method="GET" action="{{ url_for('index') }}">
        <input type="text" name="search" value="{{ search }}" placeholder="Search by name, cupboard, shelf, box, or notes">
        <button class="actions" style="background:#60a5fa; border:none; padding:10px 14px; border-radius:10px; font-weight:700;">Search</button>
    </form>
    <table>
        <tr>
            <th>Name</th>
            <th>Quantity</th>
            <th>Cupboard</th>
            <th>Shelf</th>
            <th>Box</th>
            <th>Expiry Date</th>
            <th>Notes</th>
            <th>Actions</th>
        </tr>
        {% for item in items %}
        <tr>
            <td>{{ item.name }}</td>
            <td><span class="pill">{{ item.quantity }}</span></td>
            <td><a href="{{ url_for('cupboard_view', cupboard_name=item.cupboard) }}">{{ item.cupboard }}</a></td>
            <td>{{ item.shelf }}</td>
            <td>{{ item.box }}</td>
            <td>{{ item.expiry_date }}</td>
            <td class="muted">{{ item.notes }}</td>
            <td>
                <a class="btn" href="{{ url_for('edit_item', item_id=item.id) }}">Edit</a>
                <a class="btn danger" href="{{ url_for('delete_item', item_id=item.id) }}" onclick="return confirm('Delete this item?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
