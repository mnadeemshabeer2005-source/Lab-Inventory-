{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Edit Item</h2>
    <form method="POST" class="grid">
        <label>Name<br><input type="text" name="name" value="{{ item.name }}" required></label>
        <label>Quantity<br><input type="number" name="quantity" value="{{ item.quantity }}" required min="0"></label>
        <label>Cupboard<br><input type="text" name="cupboard" value="{{ item.cupboard }}" required></label>
        <label>Shelf<br><input type="text" name="shelf" value="{{ item.shelf }}"></label>
        <label>Box<br><input type="text" name="box" value="{{ item.box }}"></label>
        <label>Expiry Date<br><input type="date" name="expiry_date" value="{{ item.expiry_date }}"></label>
        <label style="grid-column:1/-1">Notes<br><textarea name="notes" rows="3" style="width:100%">{{ item.notes }}</textarea></label>
        <div><button class="btn" type="submit">Update</button> <a class="btn" href="{{ url_for('index') }}">Cancel</a></div>
    </form>
</div>
{% endblock %}
